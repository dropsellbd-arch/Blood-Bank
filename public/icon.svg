<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7f1d1d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="#ffffff" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="#fff5f5" stroke="#fee2e2" stroke-width="4" />

  <!-- Blood Drop Shape -->
  <g filter="url(#dropShadow)">
    <path
      d="M256 64 C256 64, 120 220, 120 330 C120 405.1 180.9 466 256 466 C331.1 466, 392 405.1, 392 330 C392 220, 256 64, 256 64 Z"
      fill="url(#redGrad)"
    />
  </g>

  <!-- Light highlight on drop -->
  <path
    d="M256 100 C256 100, 150 230, 150 320 C150 345, 160 370, 175 390 C160 365, 155 330, 175 285 C195 240, 256 100, 256 100 Z"
    fill="#ffffff"
    opacity="0.3"
  />

  <!-- White Medical Cross inside drop -->
  <rect x="236" y="270" width="40" height="110" rx="8" fill="#ffffff" />
  <rect x="201" y="305" width="110" height="40" rx="8" fill="#ffffff" />

  <!-- Small pulse heart indicator dot -->
  <circle cx="256" cy="325" r="8" fill="#dc2626" />
</svg>
