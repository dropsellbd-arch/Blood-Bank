    <script>
      // Compatibility shim: Prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _f = window.fetch;
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return _f; },
                  set: function(v) { _f = v; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          }
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(v) { _f = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
